
name: Kofteci POS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ZIP dosyasini ac
        run: |
          mkdir project
          unzip KofteciPOS_Android_Proje.zip -d project
          find project -maxdepth 4 -type f

      - name: Gradle kur ve APK olustur
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          cd project
          gradle assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: KofteciPOS-APK
          path: project/app/build/outputs/apk/debug/*.apk
