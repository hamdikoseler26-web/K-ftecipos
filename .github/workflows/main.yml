name: Kofteci POS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: ZIP dosyasini ac
        run: |
          mkdir -p project
          unzip -o KofteciPOS_Android_Proje.zip -d project
          ls -la project/KofteciPOS_Android

      - name: Gradle 8.7 kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: APK olustur
        working-directory: project/KofteciPOS_Android
        run: gradle assembleDebug --stacktrace

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: KofteciPOS-APK
          path: project/KofteciPOS_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
