
name: Kofteci POS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP dosyasını aç ve APK oluştur
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          
          unzip -q "$ZIP_FILE" -d project
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          "$GRADLEW" -p "$PROJECT_DIR" assembleDebug
          ZIP_FILE="./KofteciPOS_Android_Proje.zip"ls -l "$ZIP_FILE"
                          ls -l "$ZIP_FILE"
                 - name: APK dosyasını hazırla
              uses: actions/upload-artifact@v4
              with:
          name: KofteciPOS-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
